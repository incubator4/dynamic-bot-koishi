syntax = "proto3";

package dbk.v1;

import "dbk/v1/common.proto";

// WebSocket frame. Handshake is `session.hello`; other frames are dropped until
// that CALL completes. Default encoding is protobuf binary.

enum FrameOp {
  FRAME_OP_UNSPECIFIED = 0;
  FRAME_OP_CALL = 1;
  FRAME_OP_OK = 2;
  FRAME_OP_ERROR = 3;
  FRAME_OP_EVENT = 4;
  FRAME_OP_PING = 5;
  FRAME_OP_PONG = 6;
}

message Frame {
  FrameOp op = 1;
  // CALL / OK / ERROR. Generated by the caller.
  string id = 2;
  // EVENT only. Monotonic per connection; v1 does not resume by seq.
  uint64 seq = 3;
  // CALL / EVENT method name, e.g. `session.hello`, `message.created`.
  string method = 4;
  // Encoded request, response, or event body for `method`.
  bytes payload = 5;
  // ERROR only. Business send failures use OK + SendStatus, not this.
  RpcError error = 6;
}
