name: Jar

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Product version is git describe (ADR-9); a shallow clone would fall back to SHA.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./jvm/gradlew

      - name: Run tests and build plugin jar
        working-directory: jvm
        run: ./gradlew --no-daemon test fatJar

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-bot-koishi-jar
          path: jvm/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jar-test-reports
          path: jvm/build/reports/tests/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: dynamic-bot-koishi-jar
          path: release

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd release
          jar_file="$(ls *-all.jar)"
          sha256sum "$jar_file" > "$jar_file.sha256"

      - name: Check tag matches git describe
        shell: bash
        run: |
          git_version="$(git describe --tags --always --abbrev=7)"
          if [[ -z "$git_version" ]]; then
            echo "git describe returned empty version"
            exit 1
          fi
          if [[ "$git_version" != "$GITHUB_REF_NAME" ]]; then
            echo "git describe $git_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          jar_file="$(ls release/*-all.jar)"
          expected="release/dynamic-bot-koishi-${GITHUB_REF_NAME}-all.jar"
          if [[ "$jar_file" != "$expected" ]]; then
            echo "Jar $jar_file does not match expected $expected"
            exit 1
          fi

      - name: Attach jar to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: dynamic-bot-koishi ${{ github.ref_name }}
          files: |
            release/*-all.jar
            release/*-all.jar.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
