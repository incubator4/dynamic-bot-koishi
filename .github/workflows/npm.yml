name: Publish to npmjs

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile --filter ./koishi...
      - run: pnpm --filter koishi-plugin-dynamic-bot build
      - name: Set npm version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: koishi
        shell: bash
        run: |
          git_version="$(git describe --tags --always --abbrev=7)"
          if [[ -z "$git_version" ]]; then
            echo "git describe returned empty version"
            exit 1
          fi
          if [[ "$git_version" != "$GITHUB_REF_NAME" ]]; then
            echo "git describe $git_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          pnpm pkg set version="$version"
          echo "koishi-plugin-dynamic-bot@$version"
      - run: pnpm publish --no-git-checks
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: koishi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
