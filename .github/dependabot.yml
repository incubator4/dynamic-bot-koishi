# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # JVM plugin: Gradle deps + wrapper in jvm/
  - package-ecosystem: gradle
    directory: /jvm
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope

  # Koishi / proto JS: pnpm workspace lockfile lives at the repo root
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
