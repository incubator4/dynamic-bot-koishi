# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # JVM plugin: Gradle deps + wrapper in jvm/
  - package-ecosystem: gradle
    directory: /jvm
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    allow:
      - dependency-type: "direct"
    groups:
      gradle:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # Koishi / proto JS: pnpm workspace lockfile lives at the repo root
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    allow:
      - dependency-type: "direct"
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    allow:
      - dependency-type: "direct"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope
